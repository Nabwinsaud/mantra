name: Debian packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        default: v0.1.0

permissions:
  contents: write

concurrency:
  group: debian-packages-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.deb_arch }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag and package version match
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$RELEASE_TAG" = "v$package_version"

      - name: Install pinned Debian packager
        run: cargo install cargo-deb --version 3.7.0 --locked

      - name: Build Debian package
        run: cargo deb -- --locked

      - name: Verify package metadata and architecture
        shell: bash
        run: |
          set -euo pipefail
          package="$(find target/debian -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$package"
          test "$(dpkg-deb --field "$package" Package)" = "mantra"
          test "$(dpkg-deb --field "$package" Architecture)" = "${{ matrix.deb_arch }}"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"

      - name: Install, run, and uninstall package
        shell: bash
        run: |
          set -euo pipefail
          package="$(find "$PWD/target/debian" -maxdepth 1 -name '*.deb' -print -quit)"
          sudo apt-get install --yes "$package"
          test "$(mantra --version)" = "mantra ${RELEASE_TAG#v}"
          sudo apt-get remove --yes mantra

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mantra-${{ env.RELEASE_TAG }}-${{ matrix.deb_arch }}-deb
          path: target/debian/*.deb
          if-no-files-found: error

      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" target/debian/*.deb --clobber

  checksums:
    name: Publish Debian checksums
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Download published packages
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "mantra_*.deb" \
            --dir dist

      - name: Generate and publish checksums
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

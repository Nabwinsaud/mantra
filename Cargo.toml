[package]
name = "pgide"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-first PostgreSQL terminal IDE"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
nucleo-matcher = "0.3"
ratatui = "0.30"
sqlparser = "0.62"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"

[profile.release]
lto = "thin"
strip = true

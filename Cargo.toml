[package]
name = "mantra"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
authors = ["Nabwin Saud"]
description = "A keyboard-first PostgreSQL terminal IDE"
license = "MIT"
homepage = "https://github.com/Nabwinsaud/mantra"
repository = "https://github.com/Nabwinsaud/mantra"
readme = "README.md"
keywords = ["postgresql", "sql", "terminal", "tui"]
categories = ["command-line-utilities", "database"]

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
futures-util = "0.3"
nucleo-matcher = "0.3"
ratatui = "0.30"
rusqlite = { version = "0.37", features = ["bundled"] }
sqlparser = "0.62"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true

[package.metadata.deb]
maintainer = "Nabwin Saud"
copyright = "2026, Nabwin Saud"
license-file = ["LICENSE", "0"]
section = "database"
priority = "optional"
depends = "$auto"
extended-description = "Mantra is a keyboard-first PostgreSQL terminal IDE with a database explorer, modal SQL editor, schema-aware completion, query history, and result navigation."
assets = [
    ["target/release/mantra", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/mantra/README.md", "644"],
    ["LICENSE", "usr/share/doc/mantra/copyright", "644"],
]
